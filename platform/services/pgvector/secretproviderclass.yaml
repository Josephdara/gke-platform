# The three database passwords from Secret Manager, mounted as files. Only this Pod reads the
# superuser password; ingest and rag-api each read their own.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: staging-pgvector
  namespace: staging-inference
  labels:
    app.kubernetes.io/name: pgvector
    app.kubernetes.io/instance: staging-pgvector
    project: gke-build-proj
    environment: staging
    service: pgvector
    owner: jd
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/gke-build-proj/secrets/staging-pgvector-admin/versions/latest"
        path: "admin"
      - resourceName: "projects/gke-build-proj/secrets/staging-pgvector-ingest/versions/latest"
        path: "ingest"
      - resourceName: "projects/gke-build-proj/secrets/staging-pgvector-rag-api/versions/latest"
        path: "rag-api"
