# Shared values for every environment. Render with exactly one environment
# file: values-local.yaml or values-staging.yaml.
project: gke-build-proj
serviceName: platform-verification-api
owner: jd

containerPort: 8080

probes:
  liveness:
    path: /livez
  readiness:
    path: /readyz

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
