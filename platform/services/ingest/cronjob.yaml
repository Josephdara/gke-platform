# Suspended: ingest runs when you start it, with
#   kubectl -n staging-inference create job --from=cronjob/staging-ingest staging-ingest-<date>
# Each run loads only documents whose SHA-256 changed, so reruns are cheap.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: staging-ingest
  namespace: staging-inference
  labels:
    app.kubernetes.io/name: ingest
    app.kubernetes.io/instance: staging-ingest
    project: gke-build-proj
    environment: staging
    service: ingest
    owner: jd
spec:
  suspend: true
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ingest
            app.kubernetes.io/instance: staging-ingest
            project: gke-build-proj
            environment: staging
            service: ingest
            owner: jd
        spec:
          serviceAccountName: staging-ingest
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ingest
              image: "us-east4-docker.pkg.dev/gke-build-proj/gke-build-proj-staging-images/ingest@sha256:6f0648006f67272016f0bd5e7c647f5cb340aee90cf6ce5b14da817a2c233491"
              imagePullPolicy: IfNotPresent
              env:
                - name: ENVIRONMENT
                  value: staging
                - name: RELEASE_VERSION
                  value: sha-aaa0a4c
                # The corpus revision this platform loads. A new snapshot is a new upload and
                # a one-line change here.
                - name: CORPUS_SOURCE
                  value: gs://gke-build-proj-staging-models/corpus/8937eb5aedca/
                - name: EMBEDDINGS_URL
                  value: http://staging-embeddings.staging-inference.svc.cluster.local:8080
                # TEI counts each input against its limit of 8 concurrent requests, and its CPU
                # backend batches 4 at a time; 4 leaves room for rag-api's question embeddings.
                - name: EMBED_BATCH
                  value: "4"
                - name: DATABASE_HOST
                  value: staging-pgvector.staging-inference.svc.cluster.local
                - name: DATABASE_PASSWORD_FILE
                  value: /var/secrets/database-password
                - name: REPORT_BUCKET
                  value: gke-build-proj-staging-build-evidence
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: secrets
                  mountPath: /var/secrets
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: secrets
              csi:
                driver: secrets-store-gke.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: staging-ingest
