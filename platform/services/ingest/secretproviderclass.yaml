# Only the ingest role's database password. The corpus and the run report use Workload Identity.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: staging-ingest
  namespace: staging-inference
  labels:
    app.kubernetes.io/name: ingest
    app.kubernetes.io/instance: staging-ingest
    project: gke-build-proj
    environment: staging
    service: ingest
    owner: jd
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/gke-build-proj/secrets/staging-pgvector-ingest/versions/latest"
        path: "database-password"
