            - name: models
              mountPath: /models
            - name: fetch
              mountPath: /opt/fetch
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: llm-cpu
          image: "us-east4-docker.pkg.dev/gke-build-proj/staging-mirror/ggml-org/llama.cpp@sha256:5b43086e3ba7ea5794d72904654f6cd41224a9b1c6ac0398f4940ee380d30f23"
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --alias
            - "assistant-chat"
            - --ctx-size
            - "8192"
            - --parallel
            - "2"
            - --n-predict
            - "384"
            - --threads
            - "3"
            - --metrics
            - --no-slots
            - --no-webui
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "3000m"
              memory: "3072Mi"
              ephemeral-storage: "2048Mi"
            limits:
              cpu: "3000m"
              memory: "3072Mi"
              ephemeral-storage: "4096Mi"
          # The startup probe gives the model startup.maxSeconds to load; liveness
          # then tolerates a busy server for a minute before restarting it.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                # Leave the Service endpoints first, then wait until no request
                # is in progress: llama.cpp stops at once on SIGTERM.
                command:
                  - /bin/sh
                  - -c
                  - >-
                    sleep 10;
                    i=0;
                    while [ "$i" -lt 120 ]; do
                    n=$(curl -fsS http://127.0.0.1:8080/metrics | sed -n 's/^llamacpp:requests_processing \([0-9.]*\).*/\1/p');
                    [ "${n%.*}" = "0" ] && exit 0;
                    i=$((i + 2)); sleep 2;
                    done
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: models
          emptyDir:
            sizeLimit: 4096Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: fetch
          configMap:
            name: staging-llm-cpu-fetch
