        component: model-server
        model: "qwen2.5-1.5b-instruct-q4-k-m"
        model-revision: "91cad51170dc346986eccefdc2dd33a9da36ead9"
      annotations:
        model-sha256: "67875cf7277daeb06945badce604b2f7405a3903987b4747b488d2e554af8058"
        checksum/fetch: f5d1e15385adb50ed304822404bdec603749c1c9fa8469cab32ed88c6513845f
    spec:
      serviceAccountName: staging-llm-cpu
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        workload-class: llm-cpu
      tolerations:
        - key: workload-class
          operator: Equal
          value: llm-cpu
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: "llm-cpu"
                  app.kubernetes.io/instance: "staging-llm-cpu"
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: fetch-model
          image: "us-east4-docker.pkg.dev/gke-build-proj/staging-mirror/distroless/python3-debian13@sha256:6c4cb3bfa4b555429dd19541796a6ba6b30c84675b460bd0bd5072f7d5bdae71"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/python3.13", "/opt/fetch/fetch_model.py"]
          env:
            - name: MODEL_BUCKET
              value: "gke-build-proj-staging-models"
            - name: MODEL_PREFIX
              value: "models/qwen2.5-1.5b-instruct-q4-k-m/91cad51170dc346986eccefdc2dd33a9da36ead9/"
            - name: MODEL_DIR
              value: /models
            - name: MODEL_FILES
              value: "[{\"path\":\"qwen2.5-1.5b-instruct-q4_k_m.gguf\",\"sha256\":\"6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e\",\"sizeBytes\":1117320736}]"
            - name: DOWNLOAD_TIMEOUT_SECONDS
              value: "600"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          # The model files land in the models emptyDir, which counts against the
          # Pod's ephemeral-storage limit, not this container's.
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: fetch
              mountPath: /opt/fetch
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: llm-cpu
          image: "us-east4-docker.pkg.dev/gke-build-proj/staging-mirror/ggml-org/llama.cpp@sha256:5b43086e3ba7ea5794d72904654f6cd41224a9b1c6ac0398f4940ee380d30f23"
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --alias
            - "assistant-chat"
            - --parallel
            - "2"
            - --n-predict
            - "384"
            - --threads
            - "3"
            - --metrics
            - --no-slots
            - --no-webui
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "3000m"
              memory: "3072Mi"
              ephemeral-storage: "2048Mi"
            limits:
              cpu: "3000m"
              memory: "3072Mi"
              ephemeral-storage: "4096Mi"
          # The startup probe gives the model startup.maxSeconds to load; liveness
          # then tolerates a busy server for a minute before restarting it.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                # Leave the Service endpoints first, then wait until no request
                # is in progress: llama.cpp stops at once on SIGTERM.
                command:
                  - /bin/sh
                  - -c
                  - >-
                    sleep 10;
                    i=0;
                    while [ "$i" -lt 120 ]; do
                    n=$(curl -fsS http://127.0.0.1:8080/metrics | sed -n 's/^llamacpp:requests_processing \([0-9.]*\).*/\1/p');
                    [ "${n%.*}" = "0" ] && exit 0;
                    i=$((i + 2)); sleep 2;
                    done
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: models
          emptyDir:
            sizeLimit: 4096Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: fetch
          configMap:
            name: staging-llm-cpu-fetch
