  selector:
    matchLabels:
      app.kubernetes.io/name: "llm-cpu"
      app.kubernetes.io/instance: "staging-llm-cpu"
  # A release never asks for a node or GPU beyond the pool's cap.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "llm-cpu"
        app.kubernetes.io/instance: "staging-llm-cpu"
        project: "gke-build-proj"
        environment: "staging"
        service: "llm-cpu"
        owner: "jd"
        app.kubernetes.io/version: "server-b12464"
