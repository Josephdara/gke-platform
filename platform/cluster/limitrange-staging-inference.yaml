apiVersion: v1
kind: LimitRange
metadata:
  name: staging-inference-limits
  namespace: staging-inference
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  limits:
    - type: Container
      # Without explicit ephemeral-storage defaults, Kubernetes copies the
      # maximum into every container that sets none, such as an init container.
      # The maximum stays below the 18.8 GB an inference node can allocate.
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
      default:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 1Gi
      max:
        cpu: "4"
        memory: 16Gi
        ephemeral-storage: 16Gi
