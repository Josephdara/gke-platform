apiVersion: v1
kind: LimitRange
metadata:
  name: staging-inference-limits
  namespace: staging-inference
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 16Gi
        ephemeral-storage: 40Gi
