apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: custom-metrics-adapter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform-controllers
  source:
    repoURL: https://github.com/Josephdara/gke-platform.git
    targetRevision: main
    path: platform/custom-metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: custom-metrics
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
