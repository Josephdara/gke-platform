apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-inference-quota
  namespace: staging-inference
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 26Gi
    limits.cpu: "10"
    limits.memory: 32Gi
    pods: "12"
    persistentvolumeclaims: "2"
    requests.storage: 20Gi
