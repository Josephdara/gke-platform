apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-inference-default-deny
  namespace: staging-inference
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-inference-allow-dns
  namespace: staging-inference
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Workload Identity tokens and Cloud Storage downloads, only for the services
# that fetch model files or load the corpus. The service label is tied to the
# Pod's own KSA by the require-service-account policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-inference-allow-google-apis
  namespace: staging-inference
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchExpressions:
      - key: service
        operator: In
        values: [llm-cpu, embeddings, ingest]
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 199.36.153.8/30
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-inference-allow-collectors
  namespace: staging-inference
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - protocol: TCP
          port: 8080
---
# The vector database accepts only rag-api, which reads the corpus, and ingest, which loads it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-inference-pgvector-ingress
  namespace: staging-inference
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      service: pgvector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: staging
          podSelector:
            matchLabels:
              service: rag-api
        - podSelector:
            matchLabels:
              service: ingest
      ports:
        - protocol: TCP
          port: 5432
---
# ingest embeds chunks through embeddings and loads them into pgvector. Its Google API egress
# for the corpus and the run report is in staging-inference-allow-google-apis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-inference-ingest-egress
  namespace: staging-inference
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      service: ingest
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              service: embeddings
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              service: pgvector
      ports:
        - protocol: TCP
          port: 5432
