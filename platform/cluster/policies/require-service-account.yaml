apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-service-account
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [staging]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: "object.spec.?serviceAccountName.orValue('') == object.metadata.?labels.environment.orValue('') + '-' + object.metadata.?labels.service.orValue('')"
      message: "spec.serviceAccountName must be <environment>-<service>, built from the environment and service labels. Use the service's own Kubernetes service account."
