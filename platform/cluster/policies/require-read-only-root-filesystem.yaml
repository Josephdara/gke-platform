apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-read-only-root-filesystem
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [staging]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
  validations:
    - expression: "variables.containers.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false) == true)"
      message: "securityContext.readOnlyRootFilesystem must be true on every container. Write temporary files to an emptyDir volume."
