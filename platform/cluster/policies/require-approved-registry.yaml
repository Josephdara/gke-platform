apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-approved-registry
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [staging]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
  validations:
    - expression: "variables.containers.all(c, c.image.startsWith('us-east4-docker.pkg.dev/gke-build-proj/gke-build-proj-staging-images/'))"
      message: "Every container image must come from us-east4-docker.pkg.dev/gke-build-proj/gke-build-proj-staging-images/. Publish the image through the pipeline and use that repository."
