    fixable: 0 critical, 0 high, 0 medium
    decision: accepted
    reason: No fixable findings. It has no shell or package manager, and it runs only the chart's download script with read-only access to the models bucket.
    reviewBy: 2026-12-31
  - source: gcr.io/gke-release/custom-metrics-stackdriver-adapter:v0.16.12-gke.4
