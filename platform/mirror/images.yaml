# Third-party images that inference workloads run, copied unchanged into the
# staging-mirror repository by mirror.sh. Copying keeps each digest, so
# manifests reference the mirror path with the same digest.
#
# Each entry: source (upstream image and tag), digest (the pinned index digest),
# target (path and tag in the mirror), purpose, and the scan decision for that
# digest: scanned (date), report (path in the evidence bucket), fixable
# (findings with a fix available), decision (accepted or replace), reason, and
# reviewBy (after this date, mirror.sh --check fails until the decision is redone).
# A material finding is a critical or high one with a fix available. Changing
# the digest means mirroring, scanning, and deciding again.
images:
  - source: ghcr.io/ggml-org/llama.cpp:server-b12464
    digest: sha256:5b43086e3ba7ea5794d72904654f6cd41224a9b1c6ac0398f4940ee380d30f23
    target: ggml-org/llama.cpp:server-b12464
    purpose: llama.cpp server, CPU build, serving the chat model as llm-cpu
    scanned: 2026-11-18
    report: inference/mirror/2026-11-18/ggml-org_llama.cpp_server-b12464.json
    fixable: 0 critical, 0 high, 20 medium
    decision: accepted
    reason: No material findings; the medium findings are in the Ubuntu base image.
    reviewBy: 2026-12-31
  - source: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
