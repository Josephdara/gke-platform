apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "model-server.fullname" . }}
  namespace: {{ include "model-server.namespace" . }}
  labels:
    {{- include "model-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "model-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- range .Values.callers }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          podSelector:
            matchLabels:
              service: {{ .service | quote }}
      ports:
        - protocol: TCP
          port: http
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - protocol: TCP
          port: http
