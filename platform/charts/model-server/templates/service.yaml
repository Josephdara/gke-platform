apiVersion: v1
kind: Service
metadata:
  name: {{ include "model-server.fullname" . }}
  namespace: {{ include "model-server.namespace" . }}
  labels:
    {{- include "model-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "model-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.server.port }}
      targetPort: http
      protocol: TCP
