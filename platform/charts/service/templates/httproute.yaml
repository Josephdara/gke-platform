{{- with .Values.httpRoute }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "service.fullname" $ }}
  namespace: {{ include "service.namespace" $ }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ printf "%s-gateway" $.Values.environment }}
  hostnames:
    - {{ .hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ include "service.fullname" $ }}
          port: 80
{{- end }}
