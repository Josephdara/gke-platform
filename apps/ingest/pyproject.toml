[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ingest"
version = "0.1.0"
description = "Loads the assistant's corpus into pgvector"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "psycopg[binary]==3.3.9"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
ingest = "ingest.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
