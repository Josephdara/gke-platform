# Accepted Trivy vulnerability findings for the platform-verification-api image. This is a demo project 

vulnerabilities:
  - id: CVE-2026-103111
    statement: "libpcre2-8-0 is used by Debian system tools, not by Python's re module or the API. Fixed in Debian 10.42-1+deb12u2; remove when the pinned python base image includes it."
    expired_at: 2026-10-19
  - id: CVE-2026-13221
    statement: "perl-base is present only as an essential Debian package; the API never runs Perl. Fixed in Debian 5.36.0-7+deb12u4; remove when the pinned python base image includes it."
    expired_at: 2026-10-19
