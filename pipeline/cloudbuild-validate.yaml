steps:
  - id: test
    name: python:3.14.10-slim-bookworm@sha256:3fe1a0b6c2d6b2ebb572906cdabeca75aeb558c0c17db5ffefbcf8094871c32b
    dir: apps/platform-verification-api
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python -m venv /workspace/.venv
        /workspace/.venv/bin/python -m pip install --disable-pip-version-check -r requirements-test.txt
        /workspace/.venv/bin/python -m pytest
        /workspace/.venv/bin/python -m pip check

  - id: test-rag-api
    name: python:3.14.10-slim-bookworm@sha256:3fe1a0b6c2d6b2ebb572906cdabeca75aeb558c0c17db5ffefbcf8094871c32b
    dir: apps/rag-api
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python -m venv /workspace/.venv-rag-api
        /workspace/.venv-rag-api/bin/python -m pip install --disable-pip-version-check -r requirements-test.txt
        /workspace/.venv-rag-api/bin/python -m pytest
        /workspace/.venv-rag-api/bin/python -m pip check

  - id: test-ingest
    name: python:3.14.10-slim-bookworm@sha256:3fe1a0b6c2d6b2ebb572906cdabeca75aeb558c0c17db5ffefbcf8094871c32b
    dir: apps/ingest
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python -m venv /workspace/.venv-ingest
        /workspace/.venv-ingest/bin/python -m pip install --disable-pip-version-check -r requirements-test.txt
        /workspace/.venv-ingest/bin/python -m pytest
        /workspace/.venv-ingest/bin/python -m pip check

  - id: test-loadgen
    name: python:3.14.10-slim-bookworm@sha256:3fe1a0b6c2d6b2ebb572906cdabeca75aeb558c0c17db5ffefbcf8094871c32b
    dir: apps/loadgen
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python -m venv /workspace/.venv-loadgen
        /workspace/.venv-loadgen/bin/python -m pip install --disable-pip-version-check -r requirements-test.txt
        /workspace/.venv-loadgen/bin/python -m pytest
        /workspace/.venv-loadgen/bin/python -m pip check

  - id: build
    name: gcr.io/cloud-builders/docker@sha256:40c2fb4fcd0ad51376eef166c2e7b2b40a3508d5776e2bf33db3783ab39d0f2e
    args: [build, --platform, linux/amd64, -t, "${_IMAGE}:sha-${SHORT_SHA}", apps/platform-verification-api]

  - id: export
    name: gcr.io/cloud-builders/docker@sha256:40c2fb4fcd0ad51376eef166c2e7b2b40a3508d5776e2bf33db3783ab39d0f2e
    args: [save, -o, /workspace/image.tar, "${_IMAGE}:sha-${SHORT_SHA}"]

  - id: scan
    name: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    args:
      - image
      - --input=/workspace/image.tar
      - --cache-dir=/workspace/.trivy
      - --scanners=vuln,secret
      - --severity=MEDIUM,HIGH,CRITICAL
      - --ignore-unfixed
      - --ignorefile=apps/platform-verification-api/.trivyignore.yaml
      - --exit-code=1

  # Every pull request builds and scans each image, so a vulnerable image fails the PR, not the publish.
  - id: build-rag-api
    name: gcr.io/cloud-builders/docker@sha256:40c2fb4fcd0ad51376eef166c2e7b2b40a3508d5776e2bf33db3783ab39d0f2e
    args: [build, --platform, linux/amd64, -t, "validate/rag-api:${SHORT_SHA}", apps/rag-api]

  - id: export-rag-api
    name: gcr.io/cloud-builders/docker@sha256:40c2fb4fcd0ad51376eef166c2e7b2b40a3508d5776e2bf33db3783ab39d0f2e
    args: [save, -o, /workspace/rag-api.tar, "validate/rag-api:${SHORT_SHA}"]

  - id: scan-rag-api
    name: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    args:
      - image
      - --input=/workspace/rag-api.tar
      - --cache-dir=/workspace/.trivy
      - --scanners=vuln,secret
      - --severity=MEDIUM,HIGH,CRITICAL
      - --ignore-unfixed
      - --ignorefile=apps/rag-api/.trivyignore.yaml
      - --exit-code=1

  # Every pull request builds and scans each image, so a vulnerable image fails the PR, not the publish.
  - id: build-ingest
    name: gcr.io/cloud-builders/docker@sha256:40c2fb4fcd0ad51376eef166c2e7b2b40a3508d5776e2bf33db3783ab39d0f2e
    args: [build, --platform, linux/amd64, -t, "validate/ingest:${SHORT_SHA}", apps/ingest]

  - id: export-ingest
    name: gcr.io/cloud-builders/docker@sha256:40c2fb4fcd0ad51376eef166c2e7b2b40a3508d5776e2bf33db3783ab39d0f2e
    args: [save, -o, /workspace/ingest.tar, "validate/ingest:${SHORT_SHA}"]

  - id: scan-ingest
    name: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    args:
      - image
      - --input=/workspace/ingest.tar
      - --cache-dir=/workspace/.trivy
      - --scanners=vuln,secret
      - --severity=MEDIUM,HIGH,CRITICAL
      - --ignore-unfixed
      - --ignorefile=apps/ingest/.trivyignore.yaml
      - --exit-code=1

  - id: build-loadgen
    name: gcr.io/cloud-builders/docker@sha256:40c2fb4fcd0ad51376eef166c2e7b2b40a3508d5776e2bf33db3783ab39d0f2e
    args: [build, --platform, linux/amd64, -t, "validate/loadgen:${SHORT_SHA}", apps/loadgen]

  - id: export-loadgen
    name: gcr.io/cloud-builders/docker@sha256:40c2fb4fcd0ad51376eef166c2e7b2b40a3508d5776e2bf33db3783ab39d0f2e
    args: [save, -o, /workspace/loadgen.tar, "validate/loadgen:${SHORT_SHA}"]

  - id: scan-loadgen
    name: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    args:
      - image
      - --input=/workspace/loadgen.tar
      - --cache-dir=/workspace/.trivy
      - --scanners=vuln,secret
      - --severity=MEDIUM,HIGH,CRITICAL
      - --ignore-unfixed
      - --ignorefile=apps/loadgen/.trivyignore.yaml
      - --exit-code=1

  - id: frontend-lint
    name: node:26-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
    dir: apps/rag-api/frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm ci --no-audit --no-fund
        npm run lint
        npm run typecheck
        npm run build

  - id: tools
    name: python:3.14.10-slim-bookworm@sha256:3fe1a0b6c2d6b2ebb572906cdabeca75aeb558c0c17db5ffefbcf8094871c32b
    waitFor: ['-']
    args: [python, pipeline/install_tools.py, /workspace/bin]

  - id: chart
    name: python:3.14.10-slim-bookworm@sha256:3fe1a0b6c2d6b2ebb572906cdabeca75aeb558c0c17db5ffefbcf8094871c32b
    waitFor: [tools]
    entrypoint: bash
    env: [PATH=/workspace/bin:/usr/local/bin:/usr/bin:/bin, SKIP_APP_TESTS=1]
    args: [platform/tests/validate-chart.sh]

  - id: terraform
    name: python:3.14.10-slim-bookworm@sha256:3fe1a0b6c2d6b2ebb572906cdabeca75aeb558c0c17db5ffefbcf8094871c32b
    waitFor: [tools]
    entrypoint: bash
    env: [PATH=/workspace/bin:/usr/local/bin:/usr/bin:/bin]
    args: [infra/tests/validate-terraform.sh]

timeout: 2400s

options:
  logging: CLOUD_LOGGING_ONLY